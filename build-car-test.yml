name: MusicFree-Car test APK

on:
  push:
    branches: [car-ci-v0.6.2-car.1]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install JavaScript dependencies
        run: npx --yes yarn@1.22.22 install --frozen-lockfile --non-interactive
      - name: Check TypeScript
        run: ./node_modules/.bin/tsc --noEmit --pretty false
      - name: Install Android build components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125'
      - name: Assemble standalone APK with test signing
        working-directory: android
        run: |
          printf '%s\n' 'RELEASE_STORE_FILE=debug.keystore' 'RELEASE_STORE_PASSWORD=android' 'RELEASE_KEY_ALIAS=androiddebugkey' 'RELEASE_KEY_PASSWORD=android' > keystore.properties
          bash ./gradlew :app:assembleRelease --console=plain
      - name: Verify APK identity and signature
        run: |
          apk=android/app/build/outputs/apk/release/app-universal-release.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify "$apk"
          "$tools/aapt" dump badging "$apk" > apk-badging.txt
          grep -F "package: name='com.r3zound.musicfreecar' versionCode='400012' versionName='0.6.2-car.1'" apk-badging.txt
          grep -E "^native-code:.*'arm64-v8a'" apk-badging.txt
          cp "$apk" MusicFree-Car-0.6.2-car.1-universal-test.apk
          sha256sum MusicFree-Car-0.6.2-car.1-universal-test.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFree-Car-0.6.2-car.1-test
          path: |
            MusicFree-Car-0.6.2-car.1-universal-test.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14


















































